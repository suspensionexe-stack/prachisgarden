<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Garden for Prachi</title>
    
    <!-- Importing the cute Dancing Script font and Poppins for the buttons -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050505; /* Deep dark background */
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
            color: #ffffff;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none; /* Prevents zooming/scrolling on mobile */
        }

        /* UI Overlay Layer */
        #ui-container {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10;
            pointer-events: none; /* Lets you click through the text to plant flowers */
            width: 100%;
        }

        /* The cute heading */
        .title {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(3.5rem, 8vw, 5.5rem);
            color: #ffb6c1; /* Soft pink */
            margin: 0 0 15px 0;
            text-shadow: 0 0 15px rgba(255, 182, 193, 0.6), 0 0 30px rgba(255, 105, 180, 0.4);
            letter-spacing: 2px;
            animation: breathe 4s ease-in-out infinite alternate;
        }

        @keyframes breathe {
            0% { transform: scale(1); opacity: 0.9; }
            100% { transform: scale(1.05); opacity: 1; }
        }

        /* Clickable Buttons */
        .controls {
            pointer-events: auto; 
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 25px;
        }

        button {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 10px 24px;
            border-radius: 30px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-size: 0.9rem;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
        }

        button:hover {
            background: rgba(255, 182, 193, 0.1);
            border-color: #ffb6c1;
            box-shadow: 0 0 15px rgba(255, 182, 193, 0.3);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <!-- Background Music (m4a format) -->
    <audio id="bg-music" loop>
        <source src="your-music-file.m4a" type="audio/mp4">
    </audio>

    <div id="ui-container">
        <!-- Cute Heading -->
        <h1 class="title">garden for Prachi</h1>
        
        <div class="controls">
            <button id="clear-btn">✨ Clear Garden</button>
            <button id="auto-btn">🪄 Auto Bloom</button>
        </div>
    </div>

    <!-- The Canvas where flowers grow -->
    <canvas id="gardenCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gardenCanvas');
        const ctx = canvas.getContext('2d');
        const clearBtn = document.getElementById('clear-btn');
        const autoBtn = document.getElementById('auto-btn');
        const music = document.getElementById('bg-music');
        let musicStarted = false;

        let width, height;
        let flowers = [];
        let autoBloomInterval = null;

        // Beautiful glowing pastel colors for the petals
        const colors = ['#ffb6c1', '#ff69b4', '#dda0dd', '#e6e6fa', '#f0e68c', '#ff7f50'];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Start background music securely
        function startMusic() {
            if (!musicStarted) {
                music.play().catch(err => console.log("Audio waiting for user interaction."));
                musicStarted = true;
            }
        }

        class Flower {
            constructor(x, targetY) {
                this.x = x;
                this.targetY = targetY;
                this.y = height; // Starts growing from the bottom of the screen
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.growthRate = Math.random() * 3 + 2;
                this.maxPetalSize = Math.random() * 12 + 10;
                this.petalSize = 0;
                this.isFullyGrown = false;
                
                // Slight curve for the stem
                this.curveOffset = (Math.random() - 0.5) * 50; 
            }

            update() {
                if (this.y > this.targetY) {
                    this.y -= this.growthRate; // Stem growing up
                } else {
                    this.isFullyGrown = true;
                    if (this.petalSize < this.maxPetalSize) {
                        this.petalSize += 0.4; // Petals blooming
                    }
                }
            }

            draw() {
                // Draw Stem
                ctx.beginPath();
                ctx.moveTo(this.x, height);
                // Quadratic curve for an organic, natural looking stem
                ctx.quadraticCurveTo(this.x + this.curveOffset, this.y + (height - this.y) / 2, this.x, this.y);
                ctx.strokeStyle = '#a9dfbf'; // Soft green
                ctx.lineWidth = 2;
                ctx.shadowBlur = 5;
                ctx.shadowColor = '#a9dfbf';
                ctx.stroke();

                // Draw Petals once stem reaches the top
                if (this.y <= this.targetY + 10) {
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = this.color;
                    ctx.fillStyle = this.color;

                    const numPetals = 6;
                    for (let i = 0; i < numPetals; i++) {
                        const angle = (Math.PI * 2 / numPetals) * i;
                        ctx.save();
                        ctx.translate(this.x, this.y);
                        ctx.rotate(angle);
                        ctx.beginPath();
                        ctx.ellipse(0, -this.petalSize, this.petalSize / 2.5, this.petalSize, 0, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.restore();
                    }

                    // Draw Flower Center
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.petalSize / 3.5, 0, Math.PI * 2);
                    ctx.fillStyle = '#fffacd';
                    ctx.shadowColor = '#fffacd';
                    ctx.fill();
                }
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height); // Clear screen every frame

            flowers.forEach(flower => {
                flower.update();
                flower.draw();
            });

            requestAnimationFrame(animate);
        }

        // --- Event Listeners ---

        // Plant flower on mouse click (Desktop)
        canvas.addEventListener('mousedown', (e) => {
            startMusic();
            flowers.push(new Flower(e.clientX, e.clientY));
        });

        // Plant flower on touch (Mobile)
        canvas.addEventListener('touchstart', (e) => {
            startMusic();
            for (let i = 0; i < e.touches.length; i++) {
                flowers.push(new Flower(e.touches[i].clientX, e.touches[i].clientY));
            }
        });

        // Clear garden button
        clearBtn.addEventListener('click', () => {
            startMusic();
            flowers = [];
            ctx.clearRect(0, 0, width, height);
        });

        // Auto bloom toggle button
        autoBtn.addEventListener('click', () => {
            startMusic();
            if (autoBloomInterval) {
                // Stop Auto Bloom
                clearInterval(autoBloomInterval);
                autoBloomInterval = null;
                autoBtn.innerText = "🪄 Auto Bloom";
                autoBtn.style.borderColor = "rgba(255, 255, 255, 0.2)";
                autoBtn.style.color = "white";
            } else {
                // Start Auto Bloom
                autoBtn.innerText = "🛑 Stop Auto";
                autoBtn.style.borderColor = "#ffb6c1";
                autoBtn.style.color = "#ffb6c1";
                
                // Plant a random flower every 600ms
                autoBloomInterval = setInterval(() => {
                    const randomX = Math.random() * width;
                    const randomY = (height * 0.2) + Math.random() * (height * 0.6); // Keep flowers mostly in the middle
                    flowers.push(new Flower(randomX, randomY));
                }, 600);
            }
        });

        // Start the animation loop
        animate();
    </script>
</body>
</html>
